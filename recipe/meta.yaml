{% set name = "django-request-id" %}
{% set version = "1.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/django-request-id-{{ version }}.tar.gz
  sha256: 0eb7ef17e21ff5efe5014e5b3cc6d22fc3396d4ea9d5b353bba2c43107998368

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - python {{ python_min }}
  run:
    - django
    - python >={{ python_min }}

test:
  imports:
    - request_id
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/nigma/django-request-id
  summary: Augment each request with unique id for logging purposes
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cshaley
